name: techdebtmanager

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgresql_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    container_name: techdebt-sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  pipeline:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    image: techdebtmanager-pipeline
    env_file:
      - path: .env
        required: false
    environment:
      SONAR_URL: http://sonarqube:9000
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    depends_on:
      - sonarqube
    command: ["--help"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    image: techdebtmanager-pipeline
    env_file:
      - path: .env
        required: false
    environment:
      SONAR_URL: http://sonarqube:9000
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    depends_on:
      - sonarqube
    entrypoint: ["uvicorn", "api:app", "--host", "0.0.0.0"]
    command: ["--port", "8000"]
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    image: techdebtmanager-dashboard
    container_name: techdebt-dashboard
    ports:
      - "${DASHBOARD_PORT:-8081}:80"
    volumes:
      - ./data:/srv/data:ro
    depends_on:
      - api

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
